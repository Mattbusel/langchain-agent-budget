[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-agent-budget"
version = "0.2.0"
description = "Hard dollar budgets for LangChain agents: reserve each model call's worst-case cost before the call, settle the real cost after, shared safely by parallel runs and deepagents subagents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Busel" }]
keywords = ["langchain", "langgraph", "deepagents", "agents", "budget", "cost", "middleware", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "llm-agent-budget>=0.2,<0.3",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-llm-prices>=0.1.0,<0.2",
    "llm-prices>=1.8,<2",
]

[project.urls]
Homepage = "https://github.com/Mattbusel/langchain-agent-budget"
Documentation = "https://github.com/Mattbusel/langchain-agent-budget/blob/main/docs/index.md"
Changelog = "https://github.com/Mattbusel/langchain-agent-budget/blob/main/CHANGELOG.md"
Issues = "https://github.com/Mattbusel/langchain-agent-budget/issues"
Budgets = "https://github.com/Mattbusel/agent-budget"
Prices = "https://github.com/Mattbusel/llm-prices"

[dependency-groups]
test = ["pytest>=8", "pytest-asyncio>=0.23", "deepagents>=0.7"]
lint = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["langchain_agent_budget"]

[tool.hatch.build.targets.sdist]
include = ["langchain_agent_budget", "tests", "docs", "examples", "CHANGELOG.md", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["T201"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true
