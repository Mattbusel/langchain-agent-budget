name: publish
# Publishes to PyPI as `langchain-agent-budget` when a tag v<version> is pushed (for example v0.1.0),
# or by hand from the Actions tab. The version must match pyproject.toml and __version__.
#
# Uses PyPI trusted publishing (no API token): on pypi.org add a (pending) trusted publisher
# for this repository, workflow publish.yml, environment pypi.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: version checks
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          grep -qx "__version__ = \"$version\"" langchain_agent_budget/__init__.py || { echo "__version__ is not $version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match $version"; exit 1; }
          fi
      - run: python -m pip install -e . build pytest pytest-asyncio
      - run: python -m pytest -q
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/langchain-agent-budget/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
